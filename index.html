<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>토론 의견 제출</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --agree:   #1a6cbe;
      --agree-light: #deeaf8;
      --disagree: #c0392b;
      --disagree-light: #fae0de;
      --bg: #f5f6f8;
      --card: #ffffff;
      --border: #dde0e6;
      --text: #1a1d23;
      --sub: #6b7280;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 60px;
    }
    header { text-align: center; margin-bottom: 28px; }
    .label-chip {
      display: inline-block;
      font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      background: #1a6cbe; color: #fff;
      padding: 4px 14px; border-radius: 20px; margin-bottom: 12px;
    }
    header h1 { font-size: clamp(20px,4vw,28px); font-weight: 900; line-height: 1.35; }
    header p.sub { margin-top: 8px; font-size: 14px; color: var(--sub); }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 28px; width: 100%; max-width: 560px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .topic-box {
      background: #eef3fb; border-left: 4px solid var(--agree);
      border-radius: 8px; padding: 14px 18px; margin-bottom: 28px;
    }
    .topic-box .topic-label { font-size: 11px; font-weight: 700; color: var(--agree); letter-spacing: .06em; margin-bottom: 4px; }
    .topic-box .topic-text  { font-size: 16px; font-weight: 700; line-height: 1.5; }
    .field { margin-bottom: 22px; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    label span.hint { font-weight: 400; color: var(--sub); margin-left: 6px; font-size: 12px; }
    input[type="text"], textarea {
      width: 100%; padding: 13px 16px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 15px; font-family: inherit; color: var(--text);
      background: #fafbfc; transition: border-color .18s; outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--agree); background: #fff; }
    textarea { resize: vertical; min-height: 110px; line-height: 1.7; }
    .side-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .side-btn {
      padding: 16px 10px; border: 2px solid var(--border); border-radius: 12px;
      font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
      background: #fff; color: var(--sub); transition: all .18s;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .side-btn .emoji { font-size: 26px; }
    .side-btn.agree.active    { border-color: var(--agree);    background: var(--agree-light);    color: var(--agree); }
    .side-btn.disagree.active { border-color: var(--disagree); background: var(--disagree-light); color: var(--disagree); }
    .side-btn:hover:not(.active) { border-color: #aab3c0; }
    .submit-btn {
      width: 100%; padding: 16px; border: none; border-radius: 12px;
      background: var(--agree); color: #fff;
      font-size: 16px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: background .18s, transform .1s; margin-top: 4px;
    }
    .submit-btn:hover  { background: #155ba0; }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn:disabled { background: #a0b4cc; cursor: not-allowed; }
    .success-box {
      display: none; flex-direction: column; align-items: center;
      text-align: center; padding: 36px 20px; gap: 12px;
    }
    .success-box .big-emoji { font-size: 52px; }
    .success-box h2 { font-size: 20px; font-weight: 900; color: #155ba0; }
    .success-box p  { font-size: 14px; color: var(--sub); line-height: 1.7; }
    .another-btn {
      margin-top: 8px; padding: 10px 24px;
      border: 2px solid var(--agree); border-radius: 10px;
      background: #fff; color: var(--agree);
      font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: all .15s;
    }
    .another-btn:hover { background: var(--agree-light); }
    .info-notice {
      max-width: 560px; width: 100%; margin-top: 18px;
      background: #fffbe6; border: 1px solid #f0d060; border-radius: 10px;
      padding: 12px 16px; font-size: 13px; color: #7a6400; line-height: 1.6;
    }
    .info-notice strong { font-weight: 700; }
  </style>
</head>
<body>

<header>
  <div class="label-chip">오늘의 토론</div>
  <h1 id="page-topic">주제를 불러오는 중…</h1>
  <p class="sub">내 생각을 먼저 글로 써보세요</p>
</header>

<div class="card">

  <div class="topic-box" id="topic-box">
    <div class="topic-label">토론 주제</div>
    <div class="topic-text" id="topic-display">잠시만 기다려주세요…</div>
  </div>

  <div class="field" id="field-name">
    <label>이름 또는 번호 <span class="hint">※ 실명 대신 번호나 별칭을 사용하세요 (예: 3번, 파란별)</span></label>
    <input type="text" id="name-input" placeholder="예) 7번, 초록바람" maxlength="10" />
  </div>

  <div class="field" id="field-side">
    <label>내 입장을 선택하세요</label>
    <div class="side-btns">
      <button class="side-btn agree" id="btn-agree" onclick="selectSide('agree')">
        <span class="emoji">👍</span> 찬성
      </button>
      <button class="side-btn disagree" id="btn-disagree" onclick="selectSide('disagree')">
        <span class="emoji">✋</span> 반대
      </button>
    </div>
  </div>

  <div class="field" id="field-text">
    <label>내 의견 <span class="hint">왜 그렇게 생각하나요? 이유를 써보세요</span></label>
    <textarea id="opinion-input" placeholder="예) 저는 찬성합니다. 왜냐하면…"></textarea>
  </div>

  <button class="submit-btn" id="submit-btn" onclick="submitOpinion()">✏️ 의견 제출하기</button>

  <div class="success-box" id="success-box">
    <div class="big-emoji">🎉</div>
    <h2>의견이 등록되었습니다!</h2>
    <p>친구들의 의견은 선생님 화면에서<br>함께 확인할 거예요.</p>
    <button class="another-btn" onclick="resetForm()">다시 제출하기</button>
  </div>
</div>

<div class="info-notice">
  💡 <strong>공감은 친한 친구라서 누르는 것이 아닙니다.</strong><br>
  근거가 분명하고 생각해볼 만한 의견에 공감해 주세요.
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  /* ══════════════════════════════════════════════════
     ★★★ firebaseConfig — 이미 설정 완료 ★★★
     ══════════════════════════════════════════════════ */
  const firebaseConfig = {
    apiKey: "AIzaSyCznZs1dxZlY1f_ByyRS77NOxkWgJ1VqYM",
    authDomain: "class-debate-b7fdd.firebaseapp.com",
    databaseURL: "https://class-debate-b7fdd-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "class-debate-b7fdd",
    storageBucket: "class-debate-b7fdd.firebasestorage.app",
    messagingSenderId: "823442875242",
    appId: "1:823442875242:web:47f5d6c94d85ff7c603b13"
  };

  /* ── 토론 주제 (수업에 맞게 수정하세요) ── */
  const TOPIC = "더 행복한 학교가 되기 위해서는 (    ) 해야 한다.";

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  document.getElementById("page-topic").textContent   = TOPIC;
  document.getElementById("topic-display").textContent = TOPIC;

  window._db    = db;
  window._TOPIC = TOPIC;
  window._ref   = ref;
  window._push  = push;
  window._serverTimestamp = serverTimestamp;
</script>

<script>
  let selectedSide = null;

  function selectSide(side) {
    selectedSide = side;
    document.getElementById("btn-agree").classList.toggle("active",    side === "agree");
    document.getElementById("btn-disagree").classList.toggle("active", side === "disagree");
  }

  async function submitOpinion() {
    const name    = document.getElementById("name-input").value.trim();
    const opinion = document.getElementById("opinion-input").value.trim();

    if (!name)         { alert("이름 또는 번호를 입력해주세요."); return; }
    if (!selectedSide) { alert("찬성 또는 반대를 선택해주세요."); return; }
    if (!opinion)      { alert("의견을 입력해주세요."); return; }
    if (opinion.length < 10) { alert("의견을 조금 더 자세히 써주세요! (10자 이상)"); return; }

    const btn = document.getElementById("submit-btn");
    btn.disabled    = true;
    btn.textContent = "제출 중…";

    try {
      await window._push(window._ref(window._db, "opinions"), {
        name,
        side: selectedSide,
        text: opinion,
        likes: 0,
        createdAt: window._serverTimestamp()
      });
      showSuccess();
    } catch (e) {
      alert("제출 중 오류가 발생했습니다.\n" + e.message);
      btn.disabled    = false;
      btn.textContent = "✏️ 의견 제출하기";
    }
  }

  function showSuccess() {
    ["field-name","field-side","field-text","topic-box","submit-btn"]
      .forEach(id => document.getElementById(id).style.display = "none");
    document.getElementById("success-box").style.display = "flex";
  }

  function resetForm() {
    document.getElementById("name-input").value    = "";
    document.getElementById("opinion-input").value = "";
    selectedSide = null;
    document.getElementById("btn-agree").classList.remove("active");
    document.getElementById("btn-disagree").classList.remove("active");

    ["field-name","field-side","field-text","topic-box"]
      .forEach(id => document.getElementById(id).style.display = "");
    document.getElementById("submit-btn").style.display  = "";
    document.getElementById("submit-btn").disabled       = false;
    document.getElementById("submit-btn").textContent    = "✏️ 의견 제출하기";
    document.getElementById("success-box").style.display = "none";
  }

  window.selectSide    = selectSide;
  window.submitOpinion = submitOpinion;
  window.resetForm     = resetForm;
</script>
</body>
</html>
